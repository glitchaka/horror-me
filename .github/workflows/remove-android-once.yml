name: One-time cleanup Android experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-android:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only Android APK assets from old v0.2.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases/tags/v0.2.0" --jq '.id')
          mapfile -t ids < <(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
              --jq '.[] | select(.name == "HorrorMe-Android-arm64-test.apk" or .name == "HorrorMe-Android-arm64-test.apk.sha256") | .id')
          for asset in "${ids[@]}"; do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset" >/dev/null
            echo "Removed APK release asset $asset"
          done
          if gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' | grep -E '^HorrorMe-Android-arm64-test.apk(\.sha256)?$'; then
            echo "Android assets remain in the release"; exit 1
          fi
          gh release edit v0.2.0 --repo "$GH_REPO" \
             --notes "Version 0.2.0: ejecutable Windows x64. Los binarios experimentales Android fueron retirados y la plataforma Android ya no forma parte del proyecto."
      - name: Delete obsolete Android development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/branches/feature/android-native-v0.2.0" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/feature/android-native-v0.2.0" >/dev/null
          fi
          echo "Android feature branch absent"
