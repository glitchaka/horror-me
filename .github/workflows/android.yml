name: Android ARM64 APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/core/**"
      - "src/render/**"
      - "include/**"
      - "CMakeLists.txt"
      - "docs/RELEASE_NOTES.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble testable ARM64 APK
        shell: bash
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify native ARM64 library in APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'lib/arm64-v8a/libhorrorme.so'

      - name: Prepare release attachment
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/HorrorMe-Android-arm64-test.apk
          cd dist
          sha256sum HorrorMe-Android-arm64-test.apk > HorrorMe-Android-arm64-test.apk.sha256

      - name: Publish APK to versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^project(HorrorMe VERSION ' CMakeLists.txt | cut -d' ' -f3)
          if [ -z "$VERSION" ]; then echo "Missing version in CMakeLists.txt"; exit 1; fi
          TAG="v$VERSION"
          for i in $(seq 1 6); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PROTOCOLO: NO CONFORME $TAG"               --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md --latest               || gh release view "$TAG" >/dev/null
          fi
          APK="HorrorMe-Android-arm64-test.apk"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK"; then
            echo "APK already exists for $TAG; no silent overwrite."
            exit 0
          fi
          gh release upload "$TAG" "dist/$APK" "dist/$APK.sha256"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK"
          echo "Android APK published to $TAG"
