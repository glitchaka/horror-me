name: Native Windows CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/windows.yml"
  pull_request:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Verify game and core tests
        run: |
          if (-not (Test-Path "build/Release/HorrorMe.exe")) {
            throw "HorrorMe.exe no fue creado"
          }
          ctest --test-dir build -C Release --output-on-failure
